# Hooks prek runs before a commit.
#
#   prek install      # put them in .git/hooks/pre-commit
#   prek run          # run them on the staged files
#   prek run --all-files
#
# The local hooks are this repository's own checks, so a commit cannot carry a
# broken plugin: the unit tests, the plugin check, and the formatter all run
# against the files being committed.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      # The formatter runs through bun, so the hook and `bun run fmt:check` use
      # the same Prettier. The mirrors-prettier repo was avoided: it lags the
      # released Prettier, and the two have disagreed over optional-chaining
      # parentheses, which makes a file pass one check and fail the other.
      - id: prettier
        name: prettier
        entry: bunx prettier --write
        language: system
        types_or: [markdown, json, yaml, javascript]

      - id: bun-test
        name: unit tests
        entry: bun test
        language: system
        files: \.(mjs|js)$
        pass_filenames: false

      - id: bun-check
        name: plugin check
        entry: bun scripts/check.mjs
        language: system
        files: \.(mjs|js|json|md)$
        pass_filenames: false
